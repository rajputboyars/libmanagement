name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Both suites start their own disposable MongoDB replica set (the binary is downloaded on first run).
      - run: npm run test:integration
      - run: npm run test:http

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Fails on any known high/critical vulnerability in production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -t studyquest-web:ci .
      - run: docker build --target worker -t studyquest-worker:ci .
      # Images are built for validation only. Pushing to a registry and deploying are separate, manually approved steps.
